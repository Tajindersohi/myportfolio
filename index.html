<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tajinder Sohi | Software Engineer</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <div class="cursor-glow"></div>
  <div class="bg-particles"></div>

  <div id="navbar-slot"></div>
  <main>
    <div id="hero-slot"></div>
    <div id="about-slot"></div>
    <div id="skills-slot"></div>
    <div id="services-slot"></div>
    <div id="education-slot"></div>
    <div id="projects-slot"></div>
    <div id="experience-slot"></div>
    <div id="contact-slot"></div>
  </main>
  <div id="footer-slot"></div>

  <script>
    async function loadPartial(slotId, filePath) {
      const slot = document.getElementById(slotId);
      if (!slot) return;
      const response = await fetch(filePath);
      if (!response.ok) throw new Error(`Failed to load ${filePath}`);
      slot.innerHTML = await response.text();
    }

    async function loadSections() {
      await Promise.all([
        loadPartial("navbar-slot", "./sections/navbar.html"),
        loadPartial("hero-slot", "./sections/hero.html"),
        loadPartial("about-slot", "./sections/about.html"),
        loadPartial("skills-slot", "./sections/skills.html"),
        loadPartial("services-slot", "./sections/services.html"),
        loadPartial("education-slot", "./sections/education.html"),
        loadPartial("projects-slot", "./sections/projects.html"),
        loadPartial("experience-slot", "./sections/experience.html"),
        loadPartial("contact-slot", "./sections/contact.html"),
        loadPartial("footer-slot", "./sections/footer.html")
      ]);
    }

    function initInteractions() {
      const menu = document.querySelector(".menu-toggle");
      const nav = document.querySelector("nav");
      const header = document.querySelector(".glass-nav");
      if (menu && nav) {
        menu.addEventListener("click", () => nav.classList.toggle("open"));
      }

      const glow = document.querySelector(".cursor-glow");
      window.addEventListener("mousemove", e => {
        if (!glow) return;
        glow.style.left = `${e.clientX}px`;
        glow.style.top = `${e.clientY}px`;
      });

      document.querySelectorAll(".magnetic").forEach(btn => {
        btn.addEventListener("mousemove", e => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          btn.style.transform = `translate(${x * 0.25}px, ${y * 0.25}px)`;
        });
        btn.addEventListener("mouseleave", () => {
          btn.style.transform = "translate(0,0)";
        });
      });

      const revealItems = document.querySelectorAll(".reveal, .reveal-left, .reveal-right");
      revealItems.forEach((el, index) => {
        const delay = (index % 8) * 0.08;
        el.style.setProperty("--delay", `${delay}s`);
      });

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add("show");
        });
      }, { threshold: 0.15 });
      revealItems.forEach(el => observer.observe(el));

      const heroImg = document.querySelector(".hero-image");
      const aboutImg = document.querySelector(".about-img");
      window.addEventListener("scroll", () => {
        const scroll = window.scrollY;
        const trigger = window.innerHeight * 0.6;
        if (heroImg && aboutImg) {
          if (scroll > trigger) {
            heroImg.classList.add("morph");
            aboutImg.classList.add("active");
          } else {
            heroImg.classList.remove("morph");
            aboutImg.classList.remove("active");
          }
        }

        if (header) {
          if (scroll > 20) header.classList.add("scrolled");
          else header.classList.remove("scrolled");
        }
      });

      const orbs = document.querySelectorAll(".hero-orb");
      window.addEventListener("mousemove", e => {
        const x = (e.clientX / window.innerWidth - 0.5) * 30;
        const y = (e.clientY / window.innerHeight - 0.5) * 30;
        orbs.forEach((orb, i) => {
          orb.style.transform = `translate(${x * (i + 1)}px, ${y * (i + 1)}px)`;
        });
      });

      document.querySelectorAll(".tilt").forEach(card => {
        card.addEventListener("mousemove", e => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = -(y - centerY) / 15;
          const rotateY = (x - centerX) / 15;
          card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "rotateX(0) rotateY(0) scale(1)";
        });
      });

      const sections = document.querySelectorAll("section");
      const navLinks = document.querySelectorAll("header nav a");
      window.addEventListener("scroll", () => {
        let current = "";
        sections.forEach(section => {
          const top = section.offsetTop - 200;
          if (scrollY >= top) current = section.getAttribute("id");
        });

        navLinks.forEach(link => {
          link.classList.remove("active");
          if (link.getAttribute("href") === `#${current}`) link.classList.add("active");
        });
      });

      const bg = document.querySelector(".bg-particles");
      if (bg) {
        for (let i = 0; i < 60; i++) {
          const p = document.createElement("span");
          const size = 2 + Math.random() * 4;
          p.style.width = `${size}px`;
          p.style.height = `${size}px`;
          p.style.left = Math.random() * 100 + "%";
          p.style.top = Math.random() * 100 + "%";
          p.style.animationDelay = Math.random() * 10 + "s";
          p.style.animationDuration = 10 + Math.random() * 20 + "s";
          if (Math.random() < 0.3) {
            p.style.background =
              Math.random() < 0.5
                ? "radial-gradient(circle, rgba(124,58,237,0.85), transparent)"
                : "radial-gradient(circle, rgba(6,182,212,0.75), transparent)";
          } else {
            p.style.background = "radial-gradient(circle, rgba(241,245,249,0.35), transparent)";
          }
          bg.appendChild(p);
        }
      }

      initExtras();
    }

    function initExtras() {
      initHeroTypewriter();
      initSkillProficiencyBars();
    }

    function initHeroTypewriter() {
      const textEl = document.querySelector(".hero-typewriter-text");
      if (!textEl || window.__heroTypingStarted) return;
      window.__heroTypingStarted = true;
      const strings = ["MERN Stack Engineer", "SaaS Builder", "UI Motion Specialist"];
      let si = 0;
      let ch = 0;
      let deleting = false;
      let pauseTicks = 0;
      const pauseAfterWord = 22;
      const pauseBetweenWords = 8;

      setInterval(() => {
        if (pauseTicks > 0) {
          pauseTicks--;
          return;
        }
        const str = strings[si];
        if (!deleting) {
          if (ch < str.length) {
            ch++;
            textEl.textContent = str.slice(0, ch);
          } else {
            pauseTicks = pauseAfterWord;
            deleting = true;
          }
        } else {
          if (ch > 0) {
            ch--;
            textEl.textContent = str.slice(0, ch);
          } else {
            deleting = false;
            si = (si + 1) % strings.length;
            pauseTicks = pauseBetweenWords;
          }
        }
      }, 90);
    }

    function initSkillProficiencyBars() {
      if (window.__skillBarsInit) return;
      window.__skillBarsInit = true;
      const fills = document.querySelectorAll(".skill-bar-fill");
      if (!fills.length) return;
      const io = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const el = entry.target;
            if (el.dataset.done) return;
            const t = el.getAttribute("data-target");
            if (!t) return;
            el.dataset.done = "1";
            requestAnimationFrame(() => {
              el.style.width = `${t}%`;
            });
          });
        },
        { threshold: 0.15 }
      );
      fills.forEach(f => io.observe(f));
    }

    function boot() {
      (async () => {
        try {
          await loadSections();
          initInteractions();
          document.body.classList.add("loaded");
        } catch (error) {
          console.error(error);
        }
      })();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
