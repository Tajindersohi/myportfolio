<section class="contact section" id="contact">
  <h2 class="section-title light">Get In <span>Touch</span></h2>

  <div class="contact-card glass-card reveal">
    <form>
      <div class="input-group">
        <input type="text" required />
        <label>Name</label>
      </div>

      <div class="input-group">
        <input type="email" required />
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="text" />
        <label>Phone</label>
      </div>

      <div class="input-group">
        <textarea rows="4" required></textarea>
        <label>Message</label>
      </div>

      <button class="btn magnetic primary full">Send Message <i class="fas fa-paper-plane"></i></button>
    </form>
  </div>
</section>
